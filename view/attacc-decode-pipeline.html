  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .form-control,

    height: 44px;
  }

    height: 44px;

      &lt;/div&gt;
    &lt;/nav&gt;

    &lt;section class=&quot;ap2-mode&quot; aria-labelledby=&quot;ap2-l0-title&quot;&gt;
      &lt;div class=&quot;ap2-mode-head&quot;&gt;
        &lt;h2 id=&quot;ap2-l0-title&quot; class=&quot;ap2-mode-title&quot;&gt;Level 0 · &lt;code&gt;level=False&lt;/code&gt;&lt;/h2&gt;
        &lt;div class=&quot;text-small text-muted&quot;&gt;QKV 与 Projection 不参与该分支，只调整 X2G；A 本身不在这里被改写&lt;/div&gt;
      &lt;/div&gt;
      &lt;div id=&quot;ap2-level-false-list&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;ap2-mode&quot; aria-labelledby=&quot;ap2-l1-title&quot;&gt;
      &lt;div class=&quot;ap2-mode-head&quot;&gt;
        &lt;h2 id=&quot;ap2-l1-title&quot; class=&quot;ap2-mode-title&quot;&gt;Level 1 · &lt;code&gt;level=True&lt;/code&gt;&lt;/h2&gt;
        &lt;div class=&quot;text-small text-muted&quot;&gt;同时折算 GPU FC、X2G 与 PIM Attention 在不同 head 间的重叠&lt;/div&gt;
      &lt;/div&gt;
      &lt;div id=&quot;ap2-level-true-list&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;ap2-common&quot; aria-labelledby=&quot;ap2-common-title&quot;&gt;
      &lt;h2 id=&quot;ap2-common-title&quot; class=&quot;ap2-mode-title&quot;&gt;所有分支共同的写回步骤&lt;/h2&gt;
      &lt;div class=&quot;ap2-writeback&quot;&gt;
        &lt;div class=&quot;ap2-writeback-row&quot;&gt;&lt;code&gt;qkv.exec_time&lt;/code&gt;&lt;span&gt;← Q′&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ap2-writeback-row&quot;&gt;&lt;code&gt;proj.exec_time&lt;/code&gt;&lt;span&gt;← P′&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ap2-writeback-row&quot;&gt;&lt;code&gt;第一个 comm_x2g&lt;/code&gt;&lt;span&gt;← X′ / 2&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ap2-writeback-row&quot;&gt;&lt;code&gt;第二个 comm_x2g&lt;/code&gt;&lt;span&gt;← X′ / 2&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ap2-writeback-row&quot;&gt;&lt;code&gt;softmax.exec_time&lt;/code&gt;&lt;span&gt;← 0&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;ap2-writeback-row&quot;&gt;&lt;code&gt;score/context&lt;/code&gt;&lt;span&gt;保持原值&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;attacc-pipeline-branches-v2&#x27;);
      const headsInput = root.querySelector(&#x27;#ap2-heads&#x27;);
      const headsValue = root.querySelector(&#x27;#ap2-heads-value&#x27;);
      const falseList = root.querySelector(&#x27;#ap2-level-false-list&#x27;);
      const trueList = root.querySelector(&#x27;#ap2-level-true-list&#x27;);

      const branches = [
        {
          id: &#x27;ap2-l0-a&#x27;, level: false, number: &#x27;①&#x27;, condition: &#x27;A &gt; X&#x27;,
          bottleneck: &#x27;Attention&#x27;, sample: {a: 48, q: 24, p: 8, x: 24},
          transform: (v, r) =&gt; ({x: v.x * r}),
          formulas: (v, out) =&gt; [
            `X′ = rX = ${out.x.toFixed(1)}`,
            &#x27;QKV / Projection：不修改&#x27;,
            &#x27;含义：X2G 只留下一个 head 的边界开销&#x27;
          ]
        },
        {
          id: &#x27;ap2-l0-b&#x27;, level: false, number: &#x27;②&#x27;, condition: &#x27;A ≤ X&#x27;,
          bottleneck: &#x27;X2G&#x27;, sample: {a: 24, q: 24, p: 8, x: 48},
          transform: (v, r) =&gt; ({x: v.x - v.a * (1 - r)}),
          formulas: (v, out) =&gt; [
            `X′ = X − A(1−r) = ${out.x.toFixed(1)}`,
            &#x27;QKV / Projection：不修改&#x27;,
            &#x27;含义：只能隐藏 N−1 个 Attention 重叠区间&#x27;
          ]
        },
        {
          id: &#x27;ap2-l1-a&#x27;, level: true, number: &#x27;③&#x27;, condition: &#x27;A &gt; F 且 A &gt; X&#x27;,
          bottleneck: &#x27;Attention&#x27;, sample: {a: 60, q: 24, p: 8, x: 24},
          transform: (v, r) =&gt; ({q: v.q * r, p: v.p * r, x: v.x * r}),
          formulas: (v, out) =&gt; [
            `Q′ = rQ = ${out.q.toFixed(1)}；P′ = rP = ${out.p.toFixed(1)}`,
            `X′ = rX = ${out.x.toFixed(1)}`,
            &#x27;含义：A 最慢，FC 与 X2G 都只留下一个 head&#x27;
          ]
        },
        {
          id: &#x27;ap2-l1-b&#x27;, level: true, number: &#x27;④&#x27;, condition: &#x27;A &gt; F 且 A ≤ X&#x27;,
          bottleneck: &#x27;X2G&#x27;, sample: {a: 48, q: 24, p: 8, x: 64},
          transform: (v, r) =&gt; ({q: v.q * r, p: v.p * r, x: v.x - v.a * (1 - r)}),
          formulas: (v, out) =&gt; [
            `Q′ = rQ = ${out.q.toFixed(1)}；P′ = rP = ${out.p.toFixed(1)}`,
            `X′ = X − A(1−r) = ${out.x.toFixed(1)}`,
            &#x27;含义：FC 留一个 head；A 只能部分掩盖更长的 X2G&#x27;
          ]
        },
        {
          id: &#x27;ap2-l1-c&#x27;, level: true, number: &#x27;⑤&#x27;, condition: &#x27;A ≤ F 且 F &gt; X&#x27;,
          bottleneck: &#x27;GPU FC&#x27;, sample: {a: 24, q: 48, p: 16, x: 32},
          transform: (v, r) =&gt; ({
            q: v.q - v.a * (1 - r) * 0.75,
            p: v.p - v.a * (1 - r) * 0.25,
            x: v.x * r
          }),
          formulas: (v, out) =&gt; [
            `Q′ = Q − ¾A(1−r) = ${out.q.toFixed(1)}`,
            `P′ = P − ¼A(1−r) = ${out.p.toFixed(1)}`,
            `X′ = rX = ${out.x.toFixed(1)}；FC 的扣减按 QKV:Proj = 3:1 分配`
          ]
        },
        {
          id: &#x27;ap2-l1-d&#x27;, level: true, number: &#x27;⑥&#x27;, condition: &#x27;A ≤ F 且 F ≤ X&#x27;,
          bottleneck: &#x27;X2G&#x27;, sample: {a: 24, q: 24, p: 8, x: 64},
          transform: (v, r) =&gt; ({q: v.q * r, p: v.p * r, x: v.x - v.a * (1 - r)}),
          formulas: (v, out) =&gt; [
            `Q′ = rQ = ${out.q.toFixed(1)}；P′ = rP = ${out.p.toFixed(1)}`,
            `X′ = X − A(1−r) = ${out.x.toFixed(1)}`,
            &#x27;含义：X 最慢；FC 留一个 head，A 只掩盖部分 X2G&#x27;
          ]
        }
      ];

      const measure = (label, kind, raw, effective, status, maxValue) =&gt; {
        const rawWidth = Math.max(0, Math.min(100, raw / maxValue * 100));
        const effectiveWidth = effective === null ? rawWidth : Math.max(0, Math.min(100, effective / maxValue * 100));
        const value = effective === null
          ? `${raw.toFixed(1)} · ${status}`
          : `${raw.toFixed(1)} → ${effective.toFixed(1)}`;
        return `
          &lt;div class=&quot;ap2-measure&quot;&gt;
            &lt;div class=&quot;ap2-measure-label&quot;&gt;&lt;code&gt;${label}&lt;/code&gt;&lt;/div&gt;
            &lt;div class=&quot;ap2-track&quot; aria-hidden=&quot;true&quot;&gt;
              &lt;div class=&quot;ap2-bar-raw ap2-${kind}&quot; style=&quot;width:${rawWidth}%&quot;&gt;&lt;/div&gt;
              &lt;div class=&quot;ap2-bar-effective ap2-${kind}&quot; style=&quot;width:${effectiveWidth}%&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;ap2-value tabular-nums&quot;&gt;${value}&lt;/div&gt;
          &lt;/div&gt;`;
      };

      const renderBranch = (branch, r) =&gt; {
        const v = branch.sample;
        const out = branch.transform(v, r);
        const rawF = branch.level ? v.q + v.p : null;
        const effectiveF = branch.level ? out.q + out.p : null;
        const maxValue = Math.max(v.a, v.x, rawF || 0, 1);
        const rows = [measure(&#x27;A&#x27;, &#x27;attn&#x27;, v.a, null, &#x27;判定量&#x27;, maxValue)];
        if (branch.level) rows.push(measure(&#x27;F&#x27;, &#x27;fc&#x27;, rawF, effectiveF, &#x27;&#x27;, maxValue));
        rows.push(measure(&#x27;X&#x27;, &#x27;x2g&#x27;, v.x, out.x, &#x27;&#x27;, maxValue));
        const formulaRows = branch.formulas(v, out)
          .map(line =&gt; `&lt;div class=&quot;ap2-formula&quot;&gt;&lt;code&gt;${line}&lt;/code&gt;&lt;/div&gt;`)
          .join(&#x27;&#x27;);
        const inputText = branch.level
          ? `示例：A=${v.a}，F=${rawF}（Q=${v.q}，P=${v.p}），X=${v.x}`
          : `示例：A=${v.a}，X=${v.x}`;
        const timelineMode = branch.level
          ? &#x27;Q、P、A、X 全部按 head 拆分&#x27;
          : &#x27;QKV/Projection 保持整层，只有 A、X 按 head 拆分&#x27;;

        return `
          &lt;section id=&quot;${branch.id}&quot; class=&quot;ap2-branch&quot; aria-labelledby=&quot;${branch.id}-title&quot;&gt;
            &lt;div class=&quot;ap2-branch-head&quot;&gt;
              &lt;span class=&quot;viz-badge&quot;&gt;分支 ${branch.number}&lt;/span&gt;
              &lt;h3 id=&quot;${branch.id}-title&quot;&gt;&lt;code&gt;${branch.condition}&lt;/code&gt;&lt;/h3&gt;
              &lt;span class=&quot;ap2-bottleneck&quot;&gt;瓶颈：${branch.bottleneck}&lt;/span&gt;
              &lt;span class=&quot;text-small text-muted&quot;&gt;${inputText}&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;ap2-branch-grid&quot;&gt;
              &lt;div class=&quot;ap2-formulas&quot;&gt;${formulaRows}&lt;/div&gt;
              &lt;div class=&quot;ap2-measures&quot; role=&quot;img&quot; aria-label=&quot;${branch.condition} 分支的原始时间与折算后时间比较&quot;&gt;
                ${rows.join(&#x27;&#x27;)}
              &lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;ap2-timeline-block&quot;&gt;
              &lt;div class=&quot;ap2-timeline-head&quot;&gt;
                &lt;span&gt;细粒度多 head 流水&lt;/span&gt;
                &lt;span class=&quot;text-small text-muted&quot;&gt;${timelineMode}；A 三段等分、X 两方向等分&lt;/span&gt;
              &lt;/div&gt;
              &lt;div class=&quot;ap2-timeline&quot; data-branch-id=&quot;${branch.id}&quot;&gt;
                &lt;svg class=&quot;ap2-timeline-svg&quot; role=&quot;img&quot; aria-label=&quot;${branch.condition} 分支的多 head 计算和通信时间轴&quot;&gt;&lt;/svg&gt;
                &lt;div class=&quot;ap2-timeline-summary text-small text-muted tabular-nums&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/section&gt;`;
      };

      const buildTimeline = (branch, n) =&gt; {
        const v = branch.sample;
        const tasks = [];
        const add = (id, head, order, label, resource, duration, deps) =&gt; {
          tasks.push({id, head, order, label, resource, duration, deps});
        };
        const perHead = {
          q: v.q / n,
          p: v.p / n,
          up: v.x / (2 * n),
          score: v.a / (3 * n),
          softmax: v.a / (3 * n),
          context: v.a / (3 * n),
          down: v.x / (2 * n)
        };

        if (branch.level) {
          for (let head = 0; head &lt; n; head += 1) {
            add(`q-${head}`, head, 0, &#x27;Q&#x27;, &#x27;GPU FC&#x27;, perHead.q, []);
            add(`up-${head}`, head, 1, &#x27;↓&#x27;, &#x27;X2G Link&#x27;, perHead.up, [`q-${head}`]);
            add(`score-${head}`, head, 2, &#x27;S&#x27;, &#x27;PIM GEMV&#x27;, perHead.score, [`up-${head}`]);
            add(`softmax-${head}`, head, 3, &#x27;M&#x27;, &#x27;Softmax&#x27;, perHead.softmax, [`score-${head}`]);
            add(`context-${head}`, head, 4, &#x27;C&#x27;, &#x27;PIM GEMV&#x27;, perHead.context, [`softmax-${head}`]);
            add(`down-${head}`, head, 5, &#x27;↑&#x27;, &#x27;X2G Link&#x27;, perHead.down, [`context-${head}`]);
            add(`p-${head}`, head, 6, &#x27;P&#x27;, &#x27;GPU FC&#x27;, perHead.p, [`down-${head}`]);
          }
        } else {
          add(&#x27;q-all&#x27;, -1, 0, &#x27;QKV&#x27;, &#x27;GPU FC&#x27;, v.q, []);
          for (let head = 0; head &lt; n; head += 1) {
            add(`up-${head}`, head, 1, &#x27;↓&#x27;, &#x27;X2G Link&#x27;, perHead.up, [&#x27;q-all&#x27;]);
            add(`score-${head}`, head, 2, &#x27;S&#x27;, &#x27;PIM GEMV&#x27;, perHead.score, [`up-${head}`]);
            add(`softmax-${head}`, head, 3, &#x27;M&#x27;, &#x27;Softmax&#x27;, perHead.softmax, [`score-${head}`]);
            add(`context-${head}`, head, 4, &#x27;C&#x27;, &#x27;PIM GEMV&#x27;, perHead.context, [`softmax-${head}`]);
            add(`down-${head}`, head, 5, &#x27;↑&#x27;, &#x27;X2G Link&#x27;, perHead.down, [`context-${head}`]);
          }
          add(&#x27;p-all&#x27;, -1, 6, &#x27;Proj&#x27;, &#x27;GPU FC&#x27;, v.p, Array.from({length: n}, (_, head) =&gt; `down-${head}`));
        }

        const scheduled = new Map();
        const remaining = new Map(tasks.map(task =&gt; [task.id, task]));
        const resourceEnd = {&#x27;GPU FC&#x27;: 0, &#x27;X2G Link&#x27;: 0, &#x27;PIM GEMV&#x27;: 0, &#x27;Softmax&#x27;: 0};

        while (remaining.size) {
          const ready = [...remaining.values()].filter(task =&gt; task.deps.every(dep =&gt; scheduled.has(dep)));
          ready.forEach(task =&gt; {
            const dependencyEnd = task.deps.length
              ? Math.max(...task.deps.map(dep =&gt; scheduled.get(dep).end))
              : 0;
            task.earliest = Math.max(dependencyEnd, resourceEnd[task.resource]);
          });
          ready.sort((left, right) =&gt;
            left.earliest - right.earliest || left.head - right.head || left.order - right.order
          );
          const task = ready[0];
          task.start = task.earliest;
          task.end = task.start + task.duration;
          resourceEnd[task.resource] = task.end;
          scheduled.set(task.id, task);
          remaining.delete(task.id);
        }

        const placed = [...scheduled.values()];
        const points = [...new Set(placed.flatMap(task =&gt; [task.start, task.end]))].sort((a, b) =&gt; a - b);
        const overlaps = [];
        for (let index = 0; index &lt; points.length - 1; index += 1) {
          const start = points[index];
          const end = points[index + 1];
          const middle = (start + end) / 2;
          const resources = new Set(
            placed.filter(task =&gt; task.start &lt; middle &amp;&amp; task.end &gt; middle).map(task =&gt; task.resource)
          );
          if (resources.size &gt;= 2) {
            const previous = overlaps[overlaps.length - 1];
            if (previous &amp;&amp; Math.abs(previous.end - start) &lt; 1e-9) previous.end = end;
            else overlaps.push({start, end});
          }
        }
        return {
          tasks: placed,
          overlaps,
          maxEnd: Math.max(...placed.map(task =&gt; task.end), 1)
        };
      };

      const svgNode = (tag, attrs = {}, text = &#x27;&#x27;) =&gt; {
        const node = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, tag);
        Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
        if (text) node.textContent = text;
        return node;
      };

      const drawTimeline = (container, branch, n) =&gt; {
        const svg = container.querySelector(&#x27;svg&#x27;);
        const summary = container.querySelector(&#x27;.ap2-timeline-summary&#x27;);
        const timeline = buildTimeline(branch, n);
        const width = Math.max(320, Math.round(container.getBoundingClientRect().width || 736));
        const compact = width &lt; 500;
        const left = compact ? 67 : 94;
        const right = 10;
        const top = 22;
        const laneGap = 36;
        const barHeight = 21;
        const resources = [&#x27;GPU FC&#x27;, &#x27;X2G Link&#x27;, &#x27;PIM GEMV&#x27;, &#x27;Softmax&#x27;];
        const shortNames = [&#x27;GPU&#x27;, &#x27;Link&#x27;, &#x27;GEMV&#x27;, &#x27;SFM&#x27;];
        const plotWidth = Math.max(180, width - left - right);
        const axisY = top + resources.length * laneGap + 1;
        const height = axisY + 38;
        const scaleX = value =&gt; left + plotWidth * value / timeline.maxEnd;
        const taskClass = {
          &#x27;GPU FC&#x27;: &#x27;ap2-task-gpu&#x27;,
          &#x27;X2G Link&#x27;: &#x27;ap2-task-link&#x27;,
          &#x27;PIM GEMV&#x27;: &#x27;ap2-task-gemv&#x27;,
          &#x27;Softmax&#x27;: &#x27;ap2-task-softmax&#x27;
        };

        svg.replaceChildren();
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
        svg.setAttribute(&#x27;height&#x27;, height);
        svg.appendChild(svgNode(&#x27;title&#x27;, {}, `${branch.condition} 的细粒度流水时间轴`));
        svg.appendChild(svgNode(&#x27;desc&#x27;, {}, &#x27;四条资源泳道展示多个 head 的 QKV、双向通信、Score、Softmax、Context 和 Projection，淡色背景表示至少两种资源并行。&#x27;));

        timeline.overlaps.forEach(interval =&gt; {
          svg.appendChild(svgNode(&#x27;rect&#x27;, {
            x: scaleX(interval.start),
            y: top - 4,
            width: Math.max(1, scaleX(interval.end) - scaleX(interval.start)),
            height: resources.length * laneGap - 5,
            class: &#x27;ap2-overlap-band&#x27;
          }));
        });

        resources.forEach((resource, index) =&gt; {
          const y = top + index * laneGap;
          svg.appendChild(svgNode(&#x27;text&#x27;, {
            x: left - 7,
            y: y + 15,
            class: &#x27;ap2-svg-text&#x27;,
            &#x27;text-anchor&#x27;: &#x27;end&#x27;
          }, compact ? shortNames[index] : resource));
          svg.appendChild(svgNode(&#x27;line&#x27;, {
            x1: left,
            y1: y + barHeight + 5,
            x2: left + plotWidth,
            y2: y + barHeight + 5,
            class: &#x27;ap2-lane-line&#x27;
          }));
        });

        timeline.tasks.forEach(task =&gt; {
          const lane = resources.indexOf(task.resource);
          const x = scaleX(task.start);
          const taskWidth = Math.max(1.5, plotWidth * task.duration / timeline.maxEnd);
          const y = top + lane * laneGap;
          const headLabel = task.head &lt; 0 ? &#x27;ALL&#x27; : `H${task.head}`;
          const label = `${headLabel} ${task.label}`;
          const rect = svgNode(&#x27;rect&#x27;, {
            x,
            y,
            width: taskWidth,
            height: barHeight,
            rx: 2,
            class: taskClass[task.resource],
            &#x27;data-tooltip&#x27;: `${headLabel} · ${task.label} · ${task.start.toFixed(1)}–${task.end.toFixed(1)}`
          });
          svg.appendChild(rect);
          if (taskWidth &gt; Math.max(30, label.length * 5.2 + 8)) {
            svg.appendChild(svgNode(&#x27;text&#x27;, {
              x: x + taskWidth / 2,
              y: y + 14,
              class: &#x27;ap2-task-label&#x27;,
              &#x27;text-anchor&#x27;: &#x27;middle&#x27;
            }, label));
          }
        });

        svg.appendChild(svgNode(&#x27;line&#x27;, {
          x1: left,
          y1: axisY,
          x2: left + plotWidth,
          y2: axisY,
          class: &#x27;ap2-axis-line&#x27;
        }));
        const tickCount = compact ? 3 : 5;
        for (let index = 0; index &lt;= tickCount; index += 1) {
          const x = left + plotWidth * index / tickCount;
          const value = timeline.maxEnd * index / tickCount;
          svg.appendChild(svgNode(&#x27;line&#x27;, {
            x1: x,
            y1: axisY - 3,
            x2: x,
            y2: axisY + 4,
            class: &#x27;ap2-axis-line&#x27;
          }));
          svg.appendChild(svgNode(&#x27;text&#x27;, {
            x,
            y: axisY + 17,
            class: &#x27;ap2-svg-muted&#x27;,
            &#x27;text-anchor&#x27;: index === 0 ? &#x27;start&#x27; : index === tickCount ? &#x27;end&#x27; : &#x27;middle&#x27;
          }, value.toFixed(value &lt; 10 ? 1 : 0)));
        }
        svg.appendChild(svgNode(&#x27;text&#x27;, {
          x: left + plotWidth / 2,
          y: axisY + 35,
          class: &#x27;ap2-svg-muted&#x27;,
          &#x27;text-anchor&#x27;: &#x27;middle&#x27;
        }, &#x27;结构示意时间线&#x27;));

        const overlapTime = timeline.overlaps.reduce((sum, interval) =&gt; sum + interval.end - interval.start, 0);
        summary.textContent = `结构跨度 ${timeline.maxEnd.toFixed(1)}；存在资源重叠 ${overlapTime.toFixed(1)} 时间单位`;
      };

      const drawTimelines = () =&gt; {
        const n = Number(headsInput.value);
        root.querySelectorAll(&#x27;.ap2-timeline&#x27;).forEach(container =&gt; {
          const branch = branches.find(item =&gt; item.id === container.dataset.branchId);
          drawTimeline(container, branch, n);
        });
      };

      const render = () =&gt; {
        const n = Number(headsInput.value);
        const r = 1 / n;
        headsValue.textContent = `${n}，r=${r.toFixed(3)}`;
        falseList.innerHTML = branches.filter(branch =&gt; !branch.level).map(branch =&gt; renderBranch(branch, r)).join(&#x27;&#x27;);
        trueList.innerHTML = branches.filter(branch =&gt; branch.level).map(branch =&gt; renderBranch(branch, r)).join(&#x27;&#x27;);
        requestAnimationFrame(drawTimelines);
      };

      headsInput.addEventListener(&#x27;input&#x27;, render);
      let resizeFrame = 0;
      const resizeObserver = new ResizeObserver(() =&gt; {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(drawTimelines);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

    return;

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {

              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,

      .then(({ x, y }) =&gt; {

    }

    }

    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);

  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }

    }

  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

      trigger == null ||

    }

  };

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }

    const trigger = getTrigger(event.target);

    }

    }

    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);

      closeTooltip();
    }

    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
