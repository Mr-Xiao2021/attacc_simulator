      const dhead = 128;
      const state = { mode: &#x27;decode&#x27;, p: 4, selected: 0 };

      const els = {
        live: root.querySelector(&#x27;#tps-live&#x27;),
        gpuCount: root.querySelector(&#x27;#tps-gpu-count&#x27;),
        picker: root.querySelector(&#x27;#tps-gpu-picker&#x27;),
        heads: root.querySelector(&#x27;#tps-heads&#x27;),
        flow: root.querySelector(&#x27;#tps-flow&#x27;),
        qkvMatrix: root.querySelector(&#x27;#tps-qkv-matrix&#x27;),
        projMatrix: root.querySelector(&#x27;#tps-proj-matrix&#x27;),
        qkvEquation: root.querySelector(&#x27;#tps-qkv-equation&#x27;),
        projEquation: root.querySelector(&#x27;#tps-proj-equation&#x27;),
        sum: root.querySelector(&#x27;#tps-sum&#x27;)
      };

      function localHeads() {
        return Nh / state.p;
      }

      function localH() {
        return H / state.p;
      }

      function headRange(i) {
        const start = i * localHeads();
        const end = start + localHeads() - 1;
        return { start, end, label: `H${start}–H${end}` };
      }

      function mLabel() {
        return state.mode === &#x27;decode&#x27; ? &#x27;B&#x27; : &#x27;B×Lin&#x27;;
      }

      function gpuCells(kind, content) {
        let html = `&lt;div class=&quot;tps-shards ${kind}&quot;&gt;`;
        for (let i = 0; i &lt; state.p; i += 1) {
          const selected = i === state.selected ? &#x27; is-selected&#x27; : &#x27;&#x27;;
          html += `&lt;div class=&quot;tps-shard ${kind}${selected}&quot;&gt;${content(i)}&lt;/div&gt;`;
        }
        return `${html}&lt;/div&gt;`;
      }

      function globalCell(kind, content) {
        return `&lt;div class=&quot;tps-global-node ${kind}&quot;&gt;${content}&lt;/div&gt;`;
      }

      function stage(label, device, body) {
        return `&lt;div class=&quot;tps-flow-stage&quot;&gt;
          &lt;div class=&quot;tps-stage-label&quot;&gt;&lt;strong&gt;${label}&lt;/strong&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;${device}&lt;/span&gt;&lt;/div&gt;
          ${body}
        &lt;/div&gt;`;
      }

      function arrow(label) {
        return `&lt;div class=&quot;tps-arrow&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;↓ ${label}&lt;/span&gt;&lt;/div&gt;`;
      }

      function renderPicker() {
        let html = &#x27;&#x27;;
        for (let i = 0; i &lt; state.p; i += 1) {
          const range = headRange(i);
          html += `&lt;button type=&quot;button&quot; class=&quot;btn viz-tile&quot; data-tps-gpu=&quot;${i}&quot; aria-pressed=&quot;${i === state.selected}&quot;&gt;GPU ${i} · ${range.label}&lt;/button&gt;`;
        }
        els.picker.innerHTML = html;
        els.picker.querySelectorAll(&#x27;[data-tps-gpu]&#x27;).forEach((button) =&gt; {
          button.addEventListener(&#x27;click&#x27;, () =&gt; {
            state.selected = Number(button.dataset.tpsGpu);
            render();
          });
        });

        const range = headRange(state.selected);
        let headsHtml = `&lt;strong&gt;GPU ${state.selected} 本地 heads：&lt;/strong&gt;`;
        for (let h = range.start; h &lt;= range.end; h += 1) {
          headsHtml += `&lt;span class=&quot;tps-head-cell tabular-nums&quot;&gt;H${h}&lt;/span&gt;`;
        }
        els.heads.innerHTML = headsHtml;
      }

      function renderFlow() {
        const M = mLabel();
        const lh = localHeads();
        const hLocal = localH();
        let html = &#x27;&#x27;;

        html += stage(&#x27;完整输入 X&#x27;, &#x27;复制态&#x27;, gpuCells(&#x27;is-global&#x27;, (i) =&gt;
          `&lt;strong&gt;GPU ${i}&lt;/strong&gt;完整 X [${M}, ${H}]`
        ));
        html += arrow(&#x27;每张卡输入相同，权重分片不同&#x27;);

        html += stage(&#x27;QKV&#x27;, &#x27;GPU · Column Parallel&#x27;, gpuCells(&#x27;is-gpu&#x27;, (i) =&gt; {
          const range = headRange(i);
          return `&lt;strong&gt;GPU ${i} · ${range.label}&lt;/strong&gt;W&lt;sub&gt;QKV,${i}&lt;/sub&gt; [${H}, ${3 * hLocal}]&lt;br&gt;QKV&lt;sub&gt;${i}&lt;/sub&gt; [${M}, ${3 * hLocal}]`;
        }));

        if (state.mode === &#x27;decode&#x27;) {
          html += arrow(&#x27;GPU → PIM&#x27;);
          html += stage(&#x27;Q/K/V 传输&#x27;, &#x27;X2G&#x27;, gpuCells(&#x27;is-x2g&#x27;, (i) =&gt;
            `&lt;strong&gt;GPU ${i} → PIM ${i}&lt;/strong&gt;QKV&lt;sub&gt;${i}&lt;/sub&gt; [${M}, ${3 * hLocal}]`
          ));
          html += arrow(&#x27;每个 PIM 只处理对应 GPU 的本地 heads&#x27;);
          html += stage(&#x27;Score → Softmax → Context&#x27;, &#x27;PIM · 按 head 独立&#x27;, gpuCells(&#x27;is-pim&#x27;, (i) =&gt; {
            const range = headRange(i);
            return `&lt;strong&gt;PIM ${i} · ${range.label}&lt;/strong&gt;${lh} heads × B&lt;br&gt;每 head: [1, d] → [1, S] → [1, d]`;
          }));
          html += arrow(&#x27;PIM → GPU&#x27;);
          html += stage(&#x27;Context 返回&#x27;, &#x27;X2G&#x27;, gpuCells(&#x27;is-x2g&#x27;, (i) =&gt;
            `&lt;strong&gt;PIM ${i} → GPU ${i}&lt;/strong&gt;Context&lt;sub&gt;${i}&lt;/sub&gt; [${M}, ${hLocal}]`
          ));
        } else {
          html += arrow(&#x27;K/V 写入 PIM，同时保留本卡 Q/K/V 语义&#x27;);
          html += stage(&#x27;历史 KV 写入&#x27;, &#x27;X2G · KV cache&#x27;, gpuCells(&#x27;is-x2g&#x27;, (i) =&gt;
            `&lt;strong&gt;GPU ${i} → PIM ${i}&lt;/strong&gt;KV&lt;sub&gt;${i}&lt;/sub&gt; [${M}, ${2 * hLocal}]`
          ));
          html += arrow(&#x27;当前 Prefill Attention 留在 GPU&#x27;);
          html += stage(&#x27;Score → Softmax → Context&#x27;, &#x27;GPU · 按 head 独立&#x27;, gpuCells(&#x27;is-gpu&#x27;, (i) =&gt; {
            const range = headRange(i);
            return `&lt;strong&gt;GPU ${i} · ${range.label}&lt;/strong&gt;${lh} heads × B&lt;br&gt;每 head: [Lin, d] → [Lin, Lin] → [Lin, d]`;
          }));
          html += arrow(&#x27;本卡 heads 隐式拼接&#x27;);
          html += stage(&#x27;本地 Context&#x27;, &#x27;GPU&#x27;, gpuCells(&#x27;is-gpu&#x27;, (i) =&gt;
            `&lt;strong&gt;GPU ${i}&lt;/strong&gt;Context&lt;sub&gt;${i}&lt;/sub&gt; [${M}, ${hLocal}]`
          ));
        }

        html += arrow(&#x27;沿 Projection 输入维使用对应权重分片&#x27;);
        html += stage(&#x27;Output Projection&#x27;, &#x27;GPU · Row Parallel&#x27;, gpuCells(&#x27;is-gpu&#x27;, (i) =&gt;
          `&lt;strong&gt;GPU ${i}&lt;/strong&gt;W&lt;sub&gt;O,${i}&lt;/sub&gt; [${hLocal}, ${H}]&lt;br&gt;Partial&lt;sub&gt;${i}&lt;/sub&gt; [${M}, ${H}]`
        ));
        html += arrow(&#x27;所有 GPU 的部分和汇合&#x27;);
        html += stage(&#x27;Σ Partialᵢ&#x27;, &#x27;G2G · AllReduce&#x27;, globalCell(&#x27;is-g2g&#x27;,
          `&lt;strong&gt;一次集合通信&lt;/strong&gt;O = Partial&lt;sub&gt;0&lt;/sub&gt; + … + Partial&lt;sub&gt;${state.p - 1}&lt;/sub&gt;`
        ));
        html += arrow(&#x27;AllReduce 结果广播回所有参与者&#x27;);
        html += stage(&#x27;完整输出 O&#x27;, &#x27;复制态&#x27;, gpuCells(&#x27;is-global&#x27;, (i) =&gt;
          `&lt;strong&gt;GPU ${i}&lt;/strong&gt;完整 O [${M}, ${H}]`
        ));

        els.flow.innerHTML = html;
      }

      function renderMatrices() {
        const M = mLabel();
        const hLocal = localH();
        let qkv = &#x27;&#x27;;
        let proj = &#x27;&#x27;;
        for (let i = 0; i &lt; state.p; i += 1) {
          const selected = i === state.selected ? &#x27; is-selected&#x27; : &#x27;&#x27;;
          qkv += `&lt;div class=&quot;tps-matrix-part${selected}&quot;&gt;G${i}&lt;/div&gt;`;
          proj += `&lt;div class=&quot;tps-matrix-part${selected}&quot;&gt;G${i}&lt;/div&gt;`;
        }
        els.qkvMatrix.style.setProperty(&#x27;--parts&#x27;, state.p);
        els.projMatrix.style.setProperty(&#x27;--parts&#x27;, state.p);
        els.qkvMatrix.innerHTML = qkv;
        els.projMatrix.innerHTML = proj;
        els.qkvMatrix.setAttribute(&#x27;aria-label&#x27;, `QKV 权重沿输出维切成 ${state.p} 份，当前选中 GPU ${state.selected}`);
        els.projMatrix.setAttribute(&#x27;aria-label&#x27;, `Projection 权重沿输入维切成 ${state.p} 份，当前选中 GPU ${state.selected}`);
        els.qkvEquation.innerHTML = `GPU ${state.selected}: X [${M}, ${H}] × W&lt;sub&gt;QKV,${state.selected}&lt;/sub&gt; [${H}, ${3 * hLocal}] = QKV&lt;sub&gt;${state.selected}&lt;/sub&gt; [${M}, ${3 * hLocal}]`;
        els.projEquation.innerHTML = `GPU ${state.selected}: Context&lt;sub&gt;${state.selected}&lt;/sub&gt; [${M}, ${hLocal}] × W&lt;sub&gt;O,${state.selected}&lt;/sub&gt; [${hLocal}, ${H}] = Partial&lt;sub&gt;${state.selected}&lt;/sub&gt; [${M}, ${H}]`;
        els.sum.innerHTML = `AllReduce: Σ&lt;sub&gt;i=0…${state.p - 1}&lt;/sub&gt; Partial&lt;sub&gt;i&lt;/sub&gt; = O [${M}, ${H}] · 每张 GPU 最终都有完整 O`;
      }

      function renderModeButtons() {
        root.querySelectorAll(&#x27;[data-tps-mode]&#x27;).forEach((button) =&gt; {
          const active = button.dataset.tpsMode === state.mode;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
        });
      }

      function render() {
        const range = headRange(state.selected);
        els.live.innerHTML = `&lt;strong&gt;${state.mode === &#x27;decode&#x27; ? &#x27;Decode&#x27; : &#x27;Prefill&#x27;}&lt;/strong&gt; · P=${state.p} · 每卡 ${localHeads()} heads · H/P=${localH()} · 3H/P=${3 * localH()} · 当前查看 GPU ${state.selected} (${range.label})`;
        renderModeButtons();
        renderPicker();
        renderFlow();
        renderMatrices();
      }

      root.querySelectorAll(&#x27;[data-tps-mode]&#x27;).forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          state.mode = button.dataset.tpsMode;
          render();
        });
      });

      els.gpuCount.addEventListener(&#x27;change&#x27;, () =&gt; {
        state.p = Number(els.gpuCount.value);
        state.selected = Math.min(state.selected, state.p - 1);
        render();
      });

      render();
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
